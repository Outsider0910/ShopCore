# ShopCore 配置
# 文本使用 MiniMessage：https://docs.advntr.dev/minimessage/format.html
# 修改后执行 /shopadmin reload（需要 shopcore.admin）

server:
  # 会写进经济系统的 businessNo：mc:<server.id>:shop:<订单UUID>，不能包含冒号
  id: "server"

database:
  # 相对于 plugins/ShopCore/；SQLite 使用 WAL，备份时连同 -wal/-shm 一起复制
  file: "shop.db"

economy:
  # 货币种类、名称、精度、余额全部来自 Wallet 官网资产表。
  # 商店不在本地配置或保存任何货币；商品/寄售在游戏内选择官网启用货币。
  # 等待 Wallet/官网返回结果的最长时间；超时按“结果未知”处理，不发货
  payment-timeout-seconds: 60
  # 官网资产表缓存时间（秒）；过期后下一次打开商店/兑换页会重新读取
  assets-cache-seconds: 60
  # 玩家余额缓存时间（秒），避免主菜单频繁刷新时重复请求官网
  balance-cache-seconds: 30
  # 钱包流水时间显示时区（与 Wallet 默认一致）
  timezone: "Asia/Shanghai"

exchange:
  # 货币兑换：源/目标货币必须是 Wallet 官网 enabled 资产
  enabled: true
  # true：配置了 A -> B 后，没有显式配置 B -> A 时自动按 1/rate 允许反向兑换
  # false：只允许 rates 里明确写出的方向
  bidirectional: true
  # 1 单位源货币 = rate 单位目标货币
  # code 必须与 Wallet 官网资产 code 一致；只有双方都在 Wallet enabled 资产里才会显示
  rates:
    POINT:
      CNY: "0.01"
    # 想固定反向比例时可以显式写，优先于自动倒数：
    # CNY:
    #   POINT: "100"

player-shop:
  # 每位玩家同时存在的玩家寄售笔数上限
  max-listings-per-player: 28

limits:
  min-price: "1"
  max-price: "1000000"
  # 单次上架/购买的最大件数
  max-quantity: 2304
  # 聊天输入等待时间
  input-timeout-seconds: 60
  # 点击确认按钮的有效时间
  confirm-timeout-seconds: 120

rules:
  # DAILY/WEEKLY/MONTHLY 的重置时区；留空使用服务器默认时区
  reset-zone: ""

